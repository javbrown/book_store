<!DOCTYPE html>
<html>
<head>
    <title>Books</title>
    <link rel="stylesheet" href="/static/styles.css">

</head>
<body>
  <nav>
    <div>
        <button><a href="/">Home</a></button>
        <button><a href="/books">Books</a> </button>
        <button><a href="/authors">Authors</a></button>
        <button><a href="/users/new">Sign up</a></button>
        <button><a href="/books/new">Add new book</a></button>
    </div>
  </nav>  
<header>
    <h1>Books</h1>
</header>
<main>
    <h2>This is a list of all my books</h2>
    <ul>Books:
        {% for book in books %}
        <li>
            <a href="/books/{{ book.id }}"><h4>{{ book.title }}</h4></a>
            <p>By {{ book.author }}</p>
            <form method="POST" action="/books/delete">
                <input type="hidden" name="id" value="{{ book.id }}">
                <button type="submit" name="submit" value="delete">X</button>
            </form>
        </li>
        {% endfor %}
    </ul>

</main>

</body>
</html>
